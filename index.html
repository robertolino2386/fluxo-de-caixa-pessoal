<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fluxo de Caixa</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>.login-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top right,color-mix(in srgb,var(--primary) 18%,transparent),transparent 34%),var(--bg)}.login-box{width:min(430px,100%);background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:32px;box-shadow:var(--shadow)}.login-logo{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-size:22px}.login-box h1{margin:18px 0 7px;font-size:25px}.login-box p{margin:0 0 24px;color:var(--muted);font-size:13px}.login-box .btn{width:100%}.mini-theme{display:flex;gap:8px;margin-top:14px}.mini-theme button{flex:1}</style></head><body><main class="login-page"><section class="login-box"><div class="login-logo"><i class="fa-solid fa-wallet"></i></div><h1>Fluxo de Caixa</h1><p>Gestão financeira pessoal com uma visão simples, organizada e profissional.</p><a class="btn" href="dashboard.html"><i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar no painel</a><div class="mini-theme"><button class="btn outline" onclick="setTheme('white')"><i class="fa-regular fa-sun"></i> White Label</button><button class="btn outline" onclick="setTheme('black')"><i class="fa-regular fa-moon"></i> Black Label</button></div></section></main><script src="js/ui.js"></script></body></html>
